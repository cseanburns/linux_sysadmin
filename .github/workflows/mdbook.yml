# Build and deploy the book to GitHub Pages.
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The build only needs read access; deployment permissions are scoped below.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Keep this pinned to the version used for local builds.
      MDBOOK_VERSION: "0.5.4"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          mkdir -p "${RUNNER_TEMP}/mdbook-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${RUNNER_TEMP}/mdbook.tar.gz"
          tar --extract --gzip --file "${RUNNER_TEMP}/mdbook.tar.gz" \
            --directory "${RUNNER_TEMP}/mdbook-bin" mdbook
          echo "${RUNNER_TEMP}/mdbook-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/mdbook-bin/mdbook" --version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with mdBook
        env:
          # Include the repository subpath (or / for a root/custom-domain site).
          MDBOOK_OUTPUT__HTML__SITE_URL: "${{ steps.pages.outputs.base_path }}/"
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
